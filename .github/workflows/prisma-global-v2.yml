name: PRISMA GLOBAL V2.1

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  actions: read

jobs:
  prisma-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: P1 - Seguridad Refinada (solo ejecutables)
        id: sec
        run: |
          CRITICAL="false"
          if grep -R -i "termux" --include="*.go" --include="*.sh" --include="*.py" --include="*.js" --include="*.ts" --exclude-dir=".git" . 2>/dev/null; then
            CRITICAL="true"
          fi
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT

      - name: P2 - Salud Integrada
        id: health
        run: |
          FAIL=$(gh run list --repo moranricardo/moranricardo --limit 5 --json conclusion -q '[.[] | select(.conclusion=="failure")] | length' 2>/dev/null || echo 0)
          echo "fail=$FAIL" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: P3 - Tabla + Deploy + Purge Camo
        run: |
          CRITICAL="${{ steps.sec.outputs.critical }}"
          FAIL="${{ steps.health.outputs.fail }}"
          
          if [ "$CRITICAL" = "true" ]; then
            MSG="GHOST CRITICAL"; COLOR="red"
          elif [ "$FAIL" -gt 0 ]; then
            MSG="BUILD FAIL"; COLOR="yellow"
          else
            MSG="ALL CLEAR"; COLOR="brightgreen"
          fi

          cat > GLOBAL_REPORT.md << MD
          # PRISMA GLOBAL REPORT V2.1 - $(date -u)
          | Repositorio | Estado | Acción Recomendada |
          |---|---|---|
          | moranricardo/moranricardo | $( [ "$CRITICAL" = "true" ] && echo "🔴 GHOST CRITICAL" || echo "🟢 OK P1" ) | Revisar *.sh/*.py, eliminar hardcoded termux |
          | moranricardo/moranricardo | $( [ "$FAIL" -gt 0 ] && echo "🟡 BUILD FAIL" || echo "🟢 OK P2" ) | Corregir workflows con failure |
          | termux-app | ⚪ GHOST DOCS | Solo .md, ignorado por filtro V2 |
          | moranricardo/cli | 🟢 PENDIENTE SCAN | Validar en siguiente iteración |

          **Capas:**
          - P1 Seguridad: --include=*.go,*.sh,*.py,*.js,*.ts (ignora .md)
          - P2 Salud: BUILD FAIL / ALL CLEAR
          - P3 Estrategia: tabla + camo bust ?v=2
          MD

          echo "{\"schemaVersion\":1,\"label\":\"PRISMA\",\"message\":\"$MSG\",\"color\":\"$COLOR\"}" > prisma.json

          if grep -q "prisma.json" README.md; then
            perl -i -pe 's|prisma\.json[^)]*|prisma.json?v=2|g' README.md
          fi

          git config user.name "prisma-bot-v2"
          git config user.email "prisma@moranricardo.dev"
          git add prisma.json GLOBAL_REPORT.md README.md
          git diff --cached --quiet || git commit -m "PRISMA V2.1: $MSG"
          git push
