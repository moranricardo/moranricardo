name: PRISMA GLOBAL
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  prisma:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Scan all repos you control
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -x
          if [ -n "$GH_TOKEN" ]; then TOKEN="$GH_TOKEN"; else TOKEN="${{ secrets.GITHUB_TOKEN }}"; fi
          echo $TOKEN | gh auth login --with-token
          REPOS=$(gh api user/repos --paginate -q '.[].name' | tr '\n' ' ')
          echo "Repos: $REPOS"
          echo "# PRISMA GLOBAL REPORT - $(date -u)" > GLOBAL_REPORT.md
          FAIL=0
          WARN=0
          for repo in $REPOS; do
            echo "== $repo ==" | tee -a GLOBAL_REPORT.md
            STATUS=$(gh api repos/moranricardo/$repo/actions/runs?per_page=1 --jq '.workflow_runs[0].conclusion' 2>/dev/null || echo "unknown")
            echo " Status: $STATUS" | tee -a GLOBAL_REPORT.md
            if [ "$STATUS" = "failure" ]; then WARN=1; fi
            rm -rf /tmp/$repo
            git clone --depth 1 https://x-access-token:${TOKEN}@github.com/moranricardo/$repo.git /tmp/$repo 2>&1 | tail -1 || continue
            if grep -R "termux" /tmp/$repo --exclude-dir=.git -n 2>/dev/null; then
              FAIL=1
              echo " GHOST in $repo" | tee -a GLOBAL_REPORT.md
            else
              echo " CLEAN $repo" | tee -a GLOBAL_REPORT.md
            fi
            rm -rf /tmp/$repo
          done
          if [ $FAIL -eq 1 ]; then
            echo '{"schemaVersion":1,"label":"PRISMA","message":"GHOST FOUND","color":"red"}' > prisma.json
          elif [ $WARN -eq 1 ]; then
            echo '{"schemaVersion":1,"label":"PRISMA","message":"WARNING","color":"yellow"}' > prisma.json
          else
            echo '{"schemaVersion":1,"label":"PRISMA","message":"ALL CLEAR","color":"brightgreen"}' > prisma.json
          fi
          cat prisma.json
      - name: Commit report
        run: |
          git config user.name "prisma-bot"
          git config user.email "noreply@moran.com"
          git add .
          git diff --staged --quiet || git commit -m "chore: prisma global conectado"
          git push || true
