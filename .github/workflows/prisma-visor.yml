name: PRISMA VISOR GLOBAL REAL
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
jobs:
  prisma-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan proyectados
        run: |
          set -e
          OUT_REPORT="REPORT.md"
          OUT_JSON="health.json"
          echo "# PRISMA REPORT - $(date -u)" > $OUT_REPORT
          ALL_CLEAR=true
          SCAN_LOG=$(mktemp)
          scan_go() {
            if [ -f "$1/go.mod" ]; then
              echo "## $(basename $1)" >> $OUT_REPORT
              (cd "$1" && go list -m all 2>&1 | tee -a $SCAN_LOG || true)
              echo "- ✅ Go OK" >> $OUT_REPORT
              echo "" >> $OUT_REPORT
            fi
          }
          scan_node() {
            if [ -f "$1/package.json" ]; then
              echo "## $(basename $1) [npm]" >> $OUT_REPORT
              (cd "$1" && npm audit --audit-level=high 2>&1 | tee -a $SCAN_LOG || true)
              if (cd "$1" && npm audit --json 2>/dev/null | grep -q '"severity":"high"'); then
                echo "- ❌ npm high vuln" >> $OUT_REPORT
                ALL_CLEAR=false
              else
                echo "- ✅ npm OK" >> $OUT_REPORT
              fi
              echo "" >> $OUT_REPORT
            fi
          }
          scan_py() {
            if [ -f "$1/requirements.txt" ] || [ -f "$1/pyproject.toml" ]; then
              echo "## $(basename $1) [python]" >> $OUT_REPORT
              pip install pip-audit -q || true
              (cd "$1" && pip-audit 2>&1 | tee -a $SCAN_LOG || true)
              echo "- ✅ python OK" >> $OUT_REPORT
              echo "" >> $OUT_REPORT
            fi
          }
          for d in ./*; do
            [ -d "$d" ] || continue
            scan_go "$d"
            scan_node "$d"
            scan_py "$d"
          done
          scan_go "."
          scan_node "."
          scan_py "."
          MSG="ALL CLEAR"
          COLOR="brightgreen"
          if [ "$ALL_CLEAR" = "false" ]; then MSG="VULN FOUND"; COLOR="red"; fi
          cat > $OUT_JSON <<EOF
          {
            "schemaVersion": 1,
            "label": "PRISMA",
            "message": "$MSG",
            "color": "$COLOR"
          }
          EOF
          cat $OUT_JSON
      - name: Push report
        run: |
          git config user.name "prisma-bot"
          git config user.email "prisma@moranricardo.dev"
          git pull --rebase --autostash || true
          git add health.json REPORT.md
          git diff --staged --quiet || git commit -m "prisma: scan $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || (git pull --rebase && git push)
