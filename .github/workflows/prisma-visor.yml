name: PRISMA VISOR GLOBAL REAL
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
jobs:
  prisma-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: GHOSTBUSTER SCAN
        run: |
          echo "# PRISMA GHOST REPORT - $(date -u)" > REPORT.md
          GHOST=0; DESYNC=0; BROKEN=0
          for d in ./*; do
            [ -d "$d" ] || continue
            echo "Scanning $d"
            if ls "$d"/*.go 2>/dev/null | head -1 | grep -q ".go"; then
              if [ ! -f "$d/go.mod" ]; then
                echo "- GHOST FILE: $d tiene.go sin go.mod" >> REPORT.md; GHOST=1
              fi
            fi
            if [ -f "$d/package.json" ] && [ ! -f "$d/package-lock.json" ] && [ ! -f "$d/pnpm-lock.yaml" ] && [ ! -f "$d/yarn.lock" ]; then
              echo "- GHOST FILE: $d package.json sin lock" >> REPORT.md; GHOST=1
            fi
            if [ -f "$d/go.mod" ]; then
              (cd "$d" && go mod tidy -diff 2>&1 | grep -q.) && echo "- DESYNC: $d go.mod sucio" >>../REPORT.md && DESYNC=1 || true
            fi
            if [ -f "$d/go.mod" ]; then
              (cd "$d" && go vet ./... 2>>../REPORT.md) || { echo "- BROKEN CODE: $d go vet falla" >>../REPORT.md; BROKEN=1; }
              (cd "$d" && go build ./... 2>>../REPORT.md) || { echo "- BROKEN CODE: $d go build falla" >>../REPORT.md; BROKEN=1; }
            fi
            if [ -f "$d/package.json" ]; then
              (cd "$d" && npm run build >>../REPORT.md 2>&1) || { echo "- BROKEN CODE: $d npm build falla" >>../REPORT.md; BROKEN=1; }
            fi
          done
          if [ $BROKEN -eq 1 ]; then
            echo '{"schemaVersion":1,"label":"PRISMA","message":"BROKEN CODE","color":"red"}' > health.json
          elif [ $DESYNC -eq 1 ] && [ $GHOST -eq 1 ]; then
            echo '{"schemaVersion":1,"label":"PRISMA","message":"FANTASMA TOTAL","color":"critical"}' > health.json
          elif [ $DESYNC -eq 1 ]; then
            echo '{"schemaVersion":1,"label":"PRISMA","message":"DESYNC","color":"orange"}' > health.json
          elif [ $GHOST -eq 1 ]; then
            echo '{"schemaVersion":1,"label":"PRISMA","message":"GHOST FILE","color":"yellow"}' > health.json
          else
            echo '{"schemaVersion":1,"label":"PRISMA","message":"ALL CLEAR","color":"brightgreen"}' > health.json
          fi
          cat health.json; cat REPORT.md
      - name: Push report
        run: |
          git config user.name "prisma-visor"
          git config user.email "prisma@visor.local"
          git pull --rebase --autostash || true
          git add REPORT.md health.json
          git diff --cached --quiet || git commit -m "prisma: scan $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || (git pull --rebase && git push)
