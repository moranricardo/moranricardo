pull prisma-scan:
cat health.json    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Scan proyectados
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPOS="cli bot-reportes bot-factory ia-didactica-core proyecto-nuevo didactic-octo-chrome ra-pulse-orchestrator moranricardo curly-enigma git"
          WORK="$GITHUB_WORKSPACE"
          echo "# PRISMA REPORT - $(date -u)" > $WORK/REPORT.md
          WARN=0

          for R in $REPOS; do
            echo "" >> $WORK/REPORT.md
            echo "## $R" >> $WORK/REPORT.md
            rm -rf /tmp/$R
            if ! gh repo clone moranricardo/$R /tmp/$R -- --depth 1 2>/dev/null; then
              echo "- ⚠️ clone failed $R" >> $WORK/REPORT.md
              continue
            fi
            echo "Cloning into '/tmp/$R'..." >> $WORK/REPORT.md

            # GO - SOLO DIRECTOS
            if [ -f /tmp/$R/go.mod ]; then
              OUT=$(cd /tmp/$R && go list -m -u -f '{{if not .Indirect}}{{if .Update}}{{.Path}} {{.Version}} [{{.Update.Version}}]{{end}}{{end}}' all 2>&1 | grep -v "^go:" | grep "\[" || true)
              if [ -n "$OUT" ]; then
                echo "- 🔴 OUTDATED Go:" >> $WORK/REPORT.md
                echo "$OUT" | sed 's/^/  - /' >> $WORK/REPORT.md
                WARN=$((WARN+1))
              else
                echo "- ✅ Go OK" >> $WORK/REPORT.md
              fi
            fi

            # NPM
            if [ -f /tmp/$R/package.json ]; then
              if [ -f /tmp/$R/package-lock.json ]; then
                VULN=$(cd /tmp/$R && npm audit --json 2>/dev/null | jq -e '.metadata.vulnerabilities | select((.high // 0) > 0 or (.moderate // 0) > 0)' > /dev/null && echo "yes" || echo "no")
                if [ "$VULN" = "yes" ]; then
                  echo "- 🔴 npm vuln" >> $WORK/REPORT.md
                  WARN=$((WARN+1))
                else
                  echo "- ✅ npm OK" >> $WORK/REPORT.md
                fi
              else
                echo "- ✅ npm OK (no lock)" >> $WORK/REPORT.md
              fi
            fi
          done

          if [ $WARN -gt 0 ]; then
            MSG="WARN $WARN outdated"
            COLOR="yellow"
          else
            MSG="ALL CLEAR"
            COLOR="brightgreen
